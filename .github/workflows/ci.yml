name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: social_studio
          POSTGRES_PASSWORD: social_studio
          POSTGRES_DB: social_studio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U social_studio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://social_studio:social_studio@localhost:5432/social_studio
      JWT_SECRET: ci-test-secret
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: 60
      GEMINI_API_KEY: ""
      DISCORD_WEBHOOK_URL: ""
      LOG_LEVEL: INFO
      ENVIRONMENT: test

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -v
